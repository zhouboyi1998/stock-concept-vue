name: Deploy to Vercel

on:
  # 当前仓库推送到 master 分支时触发
  push:
    branches: [ master ]
  # trigger 触发
  repository_dispatch:
    types: [ deploy ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码仓库内容 (当前仓库 stock-concept-vue)
      - name: Checkout repo-vue
        uses: actions/checkout@v4
        with:
          path: repo-vue

      # 2. 拉取数据仓库内容 (stock-concept-data)
      - name: Checkout repo-data
        uses: actions/checkout@v4
        with:
          repository: zhouboyi1998/stock-concept-data
          path: repo-data

      # 3. 将数据仓库的数据复制到代码仓库
      - name: Merge data into src/
        run: |
          cp -r repo-data/data repo-vue/src/data
          echo "✅ data/ 已复制到 src/data/"

      # 4. 安装依赖
      - name: Install dependencies
        working-directory: repo-vue
        run: npm install

      # 5. 安装 Vercel CLI
      - name: Install Vercel CLI
        run: npm install -g vercel

      # 6. 拉取 Vercel 项目配置
      - name: Pull Vercel env
        working-directory: repo-vue
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 7. 构建项目
      - name: Build
        working-directory: repo-vue
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 8. 部署到 Vercel
      - name: Deploy
        working-directory: repo-vue
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
